<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- 毛茸茸的边缘（A 版原样保留） -->
    <filter id="fuzz" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fuzz2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- A 版原来的配色，一个字没改 -->
    <radialGradient id="shade" cx="42%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f7f2ef"/>
      <stop offset="100%" stop-color="#e6ddd7"/>
    </radialGradient>
    <radialGradient id="padGrad" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffc2cd"/>
      <stop offset="70%" stop-color="#f7a8b8"/>
      <stop offset="100%" stop-color="#ec95a7"/>
    </radialGradient>
  </defs>

  <!-- 白色毛球主体 -->
  <g filter="url(#fuzz)">
    <ellipse cx="60" cy="63" rx="50" ry="46" fill="url(#shade)"/>
  </g>

  <!-- 四个趾垫：改成 B 的排布（上弧线 左中右） -->
  <g filter="url(#fuzz2)">
    <ellipse cx="31" cy="49" rx="11.5" ry="12.5" fill="url(#padGrad)"/>
    <ellipse cx="50" cy="38" rx="11.5" ry="13" fill="url(#padGrad)"/>
    <ellipse cx="71" cy="38" rx="11.5" ry="13" fill="url(#padGrad)"/>
    <ellipse cx="90" cy="49" rx="11.5" ry="12.5" fill="url(#padGrad)"/>
  </g>

  <!-- 大掌垫：改成 B 的排布（下中） -->
  <g filter="url(#fuzz2)">
    <ellipse cx="61" cy="79" rx="24" ry="18" fill="url(#padGrad)"/>
  </g>

  <!-- 肉垫高光 -->
  <ellipse cx="27" cy="45" rx="3.8" ry="2.8" fill="#ffffff" opacity=".55"/>
  <ellipse cx="46" cy="33" rx="3.8" ry="2.8" fill="#ffffff" opacity=".55"/>
  <ellipse cx="67" cy="33" rx="3.8" ry="2.8" fill="#ffffff" opacity=".55"/>
  <ellipse cx="56" cy="73" rx="6" ry="4" fill="#ffffff" opacity=".45"/>
</svg>
