<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跳一跳 · 小虎鲸的游戏屋</title>
<link rel="stylesheet" href="../style.css?v=20261123g">
</head>
<body style="--accent: var(--whack)">
<div class="bubbles" id="bubbles"></div>

<div class="game-page">
  <div class="topbar">
    <a class="back" href="../index.html">← 回游戏屋</a>
    <div class="hud" id="hud">
      <span>高度 <b id="hud-height">0</b> / <b id="hud-goal">--</b></span>
      <span>最高 <b id="hud-best">0</b></span>
    </div>
  </div>

  <div class="stage">
    <div class="jump-wrap" id="jump-wrap">
      <canvas id="game"></canvas>

      <div class="fish-overlay" id="view-modes">
        <h2>跳一跳</h2>
        <p class="note">鼠标左右带 · 踩住往上跳 · 踩空就掉下去</p>
        <div class="mode-list" id="mode-list"></div>
      </div>

      <div class="fish-end" id="over-overlay" hidden>
        <div class="fish-end-bg" id="over-bg"></div>
        <div class="fish-end-card">
          <h2 id="over-title">掉下去了！</h2>
          <p class="fish-end-line" id="over-line"></p>
          <p class="fish-end-stats" id="over-note"></p>
          <div class="actions">
            <button class="btn primary" id="btn-again">再来一次</button>
            <button class="btn" id="btn-to-modes">换一关</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="legal">
  <p>画作版权归白墙所有，不得商用、不得二次发布</p>
  <p>非官方同人作品，与深度求索无隶属关系</p>
</footer>

<script src="../js/bubbles.js?v=20261123g"></script>
<script src="../js/jump.js?v=20261123b"></script>
</body>
</html>
