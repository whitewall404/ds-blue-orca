<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
  <iframe id="f"></iframe>
  <script>
    var q = new URLSearchParams(location.search);
    var p = q.get('p') || 'index.html';
    var w = q.get('w') || '390';
    var h = q.get('h') || '844';
    var f = document.getElementById('f');
    f.style.width = w + 'px';
    f.style.height = h + 'px';
    f.src = '../' + p;
  </script>
</body>
</html>
