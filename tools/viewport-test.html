<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#111;color:#0f0;font-family:monospace;padding:20px;font-size:16px;line-height:2}
  b{color:#fff}
</style>
</head><body>
<div id="v"></div>
<script>
function upd() {
  var vv = window.visualViewport;
  document.getElementById('v').textContent =
    'innerWidth: ' + window.innerWidth + '\n' +
    'innerHeight: ' + window.innerHeight + '\n' +
    'devicePixelRatio: ' + window.devicePixelRatio + '\n' +
    'visualViewport.width: ' + (vv ? vv.width : '-') + '\n' +
    'visualViewport.scale: ' + (vv ? vv.scale : '-') + '\n' +
    'body.scrollWidth: ' + document.body.scrollWidth + '\n' +
    'doc.scrollWidth: ' + document.documentElement.scrollWidth;
}
upd();
window.addEventListener('resize', upd);
if (window.visualViewport) window.visualViewport.addEventListener('resize', upd);
</script>
</body></html>
