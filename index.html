<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小虎鲸的游戏屋</title>
<link rel="stylesheet" href="style.css?v=20261123g">
<link rel="icon" href="assets/orca.png">
</head>
<body class="menu-page">

<div class="bubbles" id="bubbles"></div>

<div class="wrap">
  <header>
    <div class="logo-bob">
      <img class="logo" id="logo" src="assets/orca-menu.png" alt="小虎鲸">
      <div class="logo-bubble" id="logo-bubble"></div>
    </div>
    <h1>小虎鲸的游戏屋</h1>
    <p class="sub">白墙 × 溟</p>
  </header>

  <main class="grid">
    <a class="card puzzle" href="games/puzzle.html">
      <img src="assets/icon-puzzle.png" alt="拼图">
      <h2>拼图</h2>
      <p>用自己的画拼回去</p>
    </a>

    <a class="card fish" href="games/fish.html">
      <img src="assets/icon-fish.png" alt="接小鱼">
      <h2>接小鱼</h2>
      <p>小虎鲸下水接鱼</p>
    </a>

    <a class="card whack" href="games/whack.html">
      <img src="assets/icon-whack.png" alt="打地鼠">
      <h2>打地鼠</h2>
      <p>猫爪一拍一个准</p>
    </a>

    <a class="card memory" href="games/memory.html">
      <img src="assets/icon-memory.png" alt="记忆翻牌">
      <h2>记忆翻牌</h2>
      <p>两张一对，翻到记住为止</p>
    </a>

    <a class="card jump" href="games/jump.html">
      <img src="assets/icon-jump.png" alt="跳一跳">
      <h2>跳一跳</h2>
      <p>踩着往上跳，掉下来就结束</p>
    </a>

    <a class="card match" href="games/match.html">
      <img src="assets/icon-match.png" alt="消消乐">
      <h2>消消乐</h2>
      <p>三个连起来就消</p>
    </a>
  </main>
</div>

<footer class="legal">
  <p>画作版权归白墙所有，不得商用、不得二次发布</p>
  <p>非官方同人作品，与深度求索无隶属关系</p>
</footer>

<script src="js/bubbles.js?v=20261123g"></script>
<script src="js/easter.js?v=20261123g"></script>

</body>
</html>
